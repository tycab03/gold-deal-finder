name: Update Gold Listings

on:
  schedule:
    - cron: "17 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install transformers torch Pillow

      - name: Run gold listing scanner
        run: python listing_finder.py

      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gold_deals.csv image_rejected.csv

          if git diff --cached --quiet; then
            echo "No listing changes to commit."
          else
            git commit -m "Update gold listings"
            git push
          fi
